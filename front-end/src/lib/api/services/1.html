<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 对话</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    }
                }
            }
        }
    </script>
    <style>
        .thinking-dots {
            display: inline-flex;
            gap: 2px;
        }
        .thinking-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #6b7280;
            animation: thinking-bounce 1.4s ease-in-out infinite both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes thinking-bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .collapse-button {
            transition: all 0.2s ease;
        }

        .collapse-button:hover {
            transform: scale(1.05);
        }

        .reasoning-content {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen bg-gradient-to-br from-blue-400 via-purple-500 to-pink-500 flex items-center justify-center p-4">
        <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-cyan-400 to-blue-500 text-white p-6 text-center">
                <h1 class="text-3xl font-bold mb-2">DeepSeek 对话助手</h1>
                <p class="text-cyan-100">与 DeepSeek AI 进行智能对话</p>
            </div>

            <!-- Settings Toggle -->
            <button @click="showSettings = !showSettings"
                    class="absolute top-4 right-4 bg-white/90 hover:bg-white backdrop-blur-sm text-gray-700 p-3 rounded-full shadow-lg transition-all duration-200 hover:scale-110 z-10">
                ⚙️
            </button>

            <!-- Settings Panel -->
            <div v-show="showSettings"
                 class="absolute top-16 right-4 bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-200 w-80 max-h-[80vh] overflow-y-auto z-20">
                <h3 class="text-lg font-semibold mb-4 text-gray-800">设置</h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                        <input v-model="settings.apiKey"
                               type="password"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="输入您的 DeepSeek API Key">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">API Base URL</label>
                        <input v-model="settings.apiBase"
                               type="text"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="https://api.deepseek.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型选择</label>
                        <select v-model="settings.model"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="deepseek-chat">deepseek-chat (通用对话)</option>
                            <option value="deepseek-reasoner">deepseek-reasoner (推理增强)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Temperature ({{ settings.temperature }})
                        </label>
                        <input v-model="settings.temperature"
                               type="range"
                               min="0" max="2" step="0.1"
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>保守 (0.0)</span>
                            <span>平衡 (1.0)</span>
                            <span>创造 (2.0)</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Max Tokens</label>
                        <input v-model="settings.maxTokens"
                               type="number"
                               min="1" max="8192"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <button @click="saveSettings"
                            class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-2 px-4 rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-200 font-medium">
                        保存设置
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div ref="messagesContainer"
                 class="h-96 overflow-y-auto p-6 bg-gray-50 space-y-4"
                 @scroll="handleScroll">
                <div v-for="(message, index) in messages"
                     :key="index"
                     class="flex"
                     :class="{ 'justify-end': message.role === 'user', 'justify-start': message.role === 'assistant' }">
                    <div class="max-w-[80%] rounded-2xl px-4 py-3 shadow-sm"
                         :class="message.role === 'user'
                                ? 'bg-gradient-to-r from-blue-500 to-purple-600 text-white'
                                : 'bg-white border border-gray-200 text-gray-800'">
                        <div class="text-xs opacity-70 mb-1 font-medium">
                            {{ message.role === 'user' ? '您' : 'DeepSeek' }}
                        </div>
                        <!-- 显示推理过程 -->
                        <div v-if="message.reasoning" class="text-sm text-gray-700 bg-blue-50 p-2 rounded mb-2 border-l-2 border-blue-400">
                            <div class="flex items-center justify-between mb-1">
                                <div class="font-medium text-xs text-blue-600">推理过程:</div>
                                <button @click="toggleReasoning(index)"
                                        class="collapse-button text-blue-500 hover:text-blue-700 text-xs px-2 py-1 rounded hover:bg-blue-100">
                                    {{ reasoningCollapsed[index] ? '展开' : '收起' }}
                                    <span class="ml-1">{{ reasoningCollapsed[index] ? '▼' : '▲' }}</span>
                                </button>
                            </div>
                            <div v-show="!reasoningCollapsed[index]"
                                 class="whitespace-pre-wrap transition-all duration-200"
                                 v-html="formatReasoning(message.reasoning)"></div>
                        </div>
                        <!-- 显示回答内容 -->
                        <div class="text-sm leading-relaxed whitespace-pre-wrap"
                             v-html="formatMessage(message.content)"></div>
                    </div>
                </div>

                <!-- Thinking indicator -->
                <div v-if="isThinking" class="flex justify-start">
                    <div class="bg-white border border-gray-200 rounded-2xl px-4 py-3 shadow-sm max-w-[80%]">
                        <div class="text-xs opacity-70 mb-2 font-medium text-gray-600">DeepSeek</div>
                        <div class="space-y-2">
                            <!-- 显示推理过程 -->
                            <div v-if="currentReasoning" class="text-sm text-gray-700 bg-gray-50 p-2 rounded border-l-2 border-blue-400">
                                <div class="flex items-center justify-between mb-1">
                                    <div class="font-medium text-xs text-blue-600">推理过程:</div>
                                    <button @click="reasoningCollapsed['thinking'] = !reasoningCollapsed['thinking']"
                                            class="collapse-button text-blue-500 hover:text-blue-700 text-xs px-2 py-1 rounded hover:bg-blue-100">
                                        {{ reasoningCollapsed['thinking'] ? '展开' : '收起' }}
                                        <span class="ml-1">{{ reasoningCollapsed['thinking'] ? '▼' : '▲' }}</span>
                                    </button>
                                </div>
                                <div v-show="!reasoningCollapsed['thinking']"
                                     class="whitespace-pre-wrap transition-all duration-200 max-h-64 overflow-y-auto">
                                    {{ currentReasoning }}
                                </div>
                            </div>
                            <!-- 思考动画 -->
                            <div class="flex items-center space-x-2">
                                <div class="thinking-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                                <span class="text-sm text-gray-500">{{ currentReasoning ? '正在继续推理...' : '正在思考中...' }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scroll to bottom button -->
            <button v-show="showScrollButton"
                    @click="scrollToBottom"
                    class="absolute bottom-20 right-6 bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-full shadow-lg transition-all duration-200 hover:scale-110">
                ↓
            </button>

            <!-- Input Area -->
            <div class="p-6 bg-white border-t border-gray-200">
                <div class="flex space-x-3">
                    <input v-model="currentMessage"
                           @keypress.enter="sendMessage"
                           type="text"
                           class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-full focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all duration-200"
                           placeholder="输入您的问题..."
                           :disabled="isThinking">
                    <button @click="sendMessage"
                            :disabled="!currentMessage.trim() || isThinking || !settings.apiKey"
                            class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-full hover:from-blue-600 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 font-medium shadow-lg hover:shadow-xl">
                        <span v-if="!isThinking">发送</span>
                        <div v-else class="animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    messages: [
                        {
                            role: "assistant",
                            content: "你好！我是 DeepSeek AI 助手。请选择合适的模型，我会尽力为您提供帮助。"
                        }
                    ],
                    currentMessage: '',
                    isThinking: false,
                    showSettings: false,
                    showScrollButton: false,
                    currentReasoning: '',
                    reasoningCollapsed: {}, // 存储每条消息的推理折叠状态
                    settings: {
                        apiKey: localStorage.getItem('deepseek_api_key') || 'sk-f0353b2deeab4bd68a376435bb6f36b9',
                        apiBase: localStorage.getItem('deepseek_api_base') || 'https://api.deepseek.com',
                        model: localStorage.getItem('deepseek_model') || 'deepseek-reasoner',
                        temperature: parseFloat(localStorage.getItem('deepseek_temperature')) || 0.7,
                        maxTokens: parseInt(localStorage.getItem('deepseek_max_tokens')) || 2000
                    }
                }
            },
            mounted() {
                this.$nextTick(() => {
                    this.scrollToBottom();
                });
            },
            methods: {
                saveSettings() {
                    localStorage.setItem('deepseek_api_key', this.settings.apiKey);
                    localStorage.setItem('deepseek_api_base', this.settings.apiBase);
                    localStorage.setItem('deepseek_model', this.settings.model);
                    localStorage.setItem('deepseek_temperature', this.settings.temperature);
                    localStorage.setItem('deepseek_max_tokens', this.settings.maxTokens);

                    this.showSettings = false;
                    this.showNotification('设置已保存！', 'success');
                },

                showNotification(message, type = 'info') {
                    // 创建通知元素
                    const notification = document.createElement('div');
                    notification.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-white text-sm font-medium shadow-lg z-50 transition-all duration-300 ${
                        type === 'success' ? 'bg-green-500' : 'bg-red-500'
                    }`;
                    notification.textContent = message;

                    document.body.appendChild(notification);

                    setTimeout(() => {
                        notification.remove();
                    }, 3000);
                },

                async sendMessage() {
                    if (!this.currentMessage.trim() || this.isThinking || !this.settings.apiKey) return;

                    const message = this.currentMessage.trim();

                    // 添加用户消息
                    this.messages.push({ role: 'user', content: message });
                    this.currentMessage = '';

                    // 开始思考状态，清空之前的推理内容
                    this.isThinking = true;
                    this.currentReasoning = '';
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });

                    try {
                        await this.sendToDeepSeek(message);
                    } catch (error) {
                        this.showNotification(`请求失败: ${error.message}`, 'error');
                    } finally {
                        this.isThinking = false;
                    }
                },

                async sendToDeepSeek(message) {
                    const response = await fetch(`${this.settings.apiBase}/v1/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.settings.apiKey}`
                        },
                        body: JSON.stringify({
                            model: this.settings.model,
                            messages: [...this.messages],
                            temperature: this.settings.temperature,
                            max_tokens: this.settings.maxTokens,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API请求失败: ${response.status} ${response.statusText}`);
                    }

                    // 添加空的助手消息用于流式更新
                    const assistantMessage = { role: 'assistant', content: '' };
                    this.messages.push(assistantMessage);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    try {
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n').filter(line => line.trim());

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.slice(6);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const parsed = JSON.parse(data);
                                        const delta = parsed.choices[0]?.delta || {};

                                        // 处理推理内容 (reasoning_content)
                                        if (delta.reasoning_content) {
                                            this.currentReasoning += delta.reasoning_content;
                                        }

                                        // 处理最终回答内容 (content)
                                        if (delta.content) {
                                            assistantMessage.content += delta.content;
                                        }

                                        this.$nextTick(() => {
                                            this.scrollToBottom();
                                        });
                                    } catch (e) {
                                        // 忽略解析错误
                                    }
                                }
                            }
                        }
                    } finally {
                        reader.releaseLock();
                        // 推理完成后，将推理内容添加到消息中
                        if (this.currentReasoning && assistantMessage.content) {
                            assistantMessage.reasoning = this.currentReasoning;
                        }
                    }
                },

                formatMessage(content) {
                    if (!content) return '';

                    return content
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em class="italic">$1</em>')
                        .replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-100 p-2 rounded mt-2 mb-2 text-sm overflow-x-auto"><code>$1</code></pre>');
                },

                formatReasoning(reasoning) {
                    if (!reasoning) return '';

                    return reasoning
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-blue-700">$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em class="italic text-blue-600">$1</em>');
                },

                scrollToBottom() {
                    if (this.$refs.messagesContainer) {
                        this.$refs.messagesContainer.scrollTop = this.$refs.messagesContainer.scrollHeight;
                    }
                },

                handleScroll() {
                    if (!this.$refs.messagesContainer) return;

                    const container = this.$refs.messagesContainer;
                    const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
                    this.showScrollButton = !isNearBottom;
                },

                toggleReasoning(messageIndex) {
                    this.$set(this.reasoningCollapsed, messageIndex, !this.reasoningCollapsed[messageIndex]);
                },

                getModelDisplayName(model) {
                    const names = {
                        'deepseek-chat': '通用对话',
                        'deepseek-reasoner': '推理增强'
                    };
                    return names[model] || model;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
