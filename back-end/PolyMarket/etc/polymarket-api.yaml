Name: PolyMarket-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 30000  # 30秒

# ✅ go-zero v1.9.x 正确的 CORS 配置
Cors:
  AllowOrigins:
    - http://localhost:3000
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  AllowHeaders:
    - Content-Type
    - Authorization
  ExposeHeaders:
    - Content-Length
  AllowCredentials: false
  MaxAge: 3600

# 日志配置
Log:
  ServiceName: polymarket-api
  Mode: console
  Level: info
  Path: logs
  KeepDays: 7
  Compress: false

# MySQL 配置
MySQL:
  Host: 192.168.8.120
  Port: 3306
  User: root
  Password: "hj@123456"
  Database: polymarket
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600

# Redis 配置
Redis:
  Host: 192.168.8.120:6379
  Password: "hj@123456"
  DB: 0
  PoolSize: 10

# 区块链配置
Blockchain:
  RpcUrl: http://127.0.0.1:8545
  ChainId: 31337
  PrivateKey: ""

# JWT 配置
Auth:
  AccessSecret: your-access-secret-key-change-in-production
  AccessExpire: 92800
  RefreshSecret: your-refresh-secret-key-change-in-production
  RefreshExpire: 604800

# 业务配置
Business:
  PlatformFeeRate: 0.02
  MinMarketDuration: 86400
  MaxMarketDuration: 31536000
  MinLiquidity: 1000

#  deepseek api-key
DeepseekConfig:
  #  sk-3fa4d916c80347fdb5fec1eb05b39311
    ApiKey: "sk-3fa4d916c80347fdb5fec1eb05b39311"

# ... existing code ...

X402Config:
  Enable: true
#  FacilitatorUrl: "http://localhost:4022"
  FacilitatorUrl: "https://x402-amoy.polygon.technology"  # Amoy testnet
  # FacilitatorUrl: "https://x402.polygon.technology"     # Mainnet (生产环境)
  DefaultNetwork: "eip155:80002"  # Amoy testnet network ID
  # DefaultNetwork: "eip155:137"  # Polygon mainnet (生产环境)
  DefaultScheme: "exact"
  Routes:
    "POST /api/v1/v1/chat/completions":
      Accepts:
        - Scheme: "exact"
          Asset: "0x41E94Eb019C0762f9Bfcf9Fb1E58725BfB0e7582"
          Price: "1000"
          Network: "eip155:80002"
          PayTo: "0x9030469B14bD60a825fADF3E75271a8d34947C5C"
          Extra:
            Name: "USDC"
            Version: "2"
      Description: "AI Prediction Service"
      MimeType: "application/json"
    "POST /api/v1/market/premium":
      Accepts:
        - Scheme: "exact"
          Asset: "0x41E94Eb019C0762f9Bfcf9Fb1E58725BfB0e7582"
          Price: "5000"
          Network: "eip155:80002"
          PayTo: "0x9030469B14bD60a825fADF3E75271a8d34947C5C"
          Extra:
              Name: "FiatTokenV2"
              Version: "2"
      Description: "Premium Market Data"
      MimeType: "application/json"